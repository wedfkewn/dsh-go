# Manual only. Unsigned build must pass before any signing Secrets are used.
name: iOS IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-ipa:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      LOG_DIR: ${{ github.workspace }}/ios-ipa-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 26.0.1
        # iOS 26 SDK required by connectivity_plus; installed on this runner image:
        # https://github.com/actions/runner-images/blob/macos-15-arm64/20261104.0514/images/macos/macos-15-arm64-Readme.md
        run: sudo xcode-select --switch /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          # Source: tooling/setup-toolchain.sh and .github/workflows/ci.yml.
          flutter-version: '3.47.7'
          channel: stable

      - name: Install build dependencies
        run: |
          set -euo pipefail
          mkdir -p "$LOG_DIR"
          {
            uname -sm
            xcodebuild -version
            flutter --version
            # Match runtime/shellbox/build-ios-libs.sh; CocoaPods is for Flutter.
            brew install llvm lld ninja libarchive meson cocoapods
            pod --version
          } 2>&1 | tee "$LOG_DIR/dependencies.log"

      - name: Resolve Flutter dependencies
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee "$LOG_DIR/flutter-pub-get.log"

      - name: Analyze Flutter app
        working-directory: app
        run: |
          set -euo pipefail
          flutter analyze 2>&1 | tee "$LOG_DIR/flutter-analyze.log"

      - name: Build ShellBox static libraries
        run: |
          set -euo pipefail
          {
            # Read the URL, pinned commit and expected checkout path from the manifest.
            source_url=$(python3 -c 'import json; print(json.load(open("third_party/shellbox/source.json"))["url"])')
            source_commit=$(python3 -c 'import json; print(json.load(open("third_party/shellbox/source.json"))["commit"])')
            source_path=$(python3 -c 'import json; print(json.load(open("third_party/shellbox/source.json"))["checkout_path"])')
            git init "$source_path"
            git -C "$source_path" fetch --depth=1 "$source_url" "$source_commit"
            git -C "$source_path" checkout --detach FETCH_HEAD
            # Actual interface: SOURCE_CHECKOUT OUTPUT_DIRECTORY (outside source).
            bash runtime/shellbox/build-ios-libs.sh "$source_path" "$RUNNER_TEMP/shellbox-ios-libs"
          } 2>&1 | tee "$LOG_DIR/shellbox-build.log"

      - name: Generate temporary iOS project if absent
        working-directory: app
        run: |
          set -euo pipefail
          {
            if [ ! -d ios ]; then
              flutter create --platforms=ios .
            else
              echo 'Using existing app/ios.'
            fi
          } 2>&1 | tee "$LOG_DIR/flutter-create-ios.log"

      - name: Compile iOS without codesigning
        working-directory: app
        run: |
          set -euo pipefail
          flutter build ios --no-codesign 2>&1 | tee "$LOG_DIR/flutter-build-ios.log"

      - name: Optional signing and IPA export
        id: signing
        working-directory: app
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILES_BASE64_JSON: ${{ secrets.IOS_PROFILES_BASE64_JSON }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_IDENTITY: ${{ secrets.IOS_SIGNING_IDENTITY }}
          IOS_EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          if [ -z "$IOS_CERTIFICATE_BASE64" ] || [ -z "$IOS_CERTIFICATE_PASSWORD" ] ||
             [ -z "$IOS_PROFILES_BASE64_JSON" ] || [ -z "$IOS_TEAM_ID" ] ||
             [ -z "$IOS_SIGNING_IDENTITY" ] || [ -z "$IOS_EXPORT_METHOD" ]; then
            echo '未配置签名，跳过 IPA 导出（需要完整配置全部六项签名 Secrets）。'
            exit 0
          fi

          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/ios-signing.XXXXXX")
          export SIGNING_DIR="$signing_dir"
          keychain="$signing_dir/signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          security list-keychains -d user > "$signing_dir/keychains.txt"
          cleanup() {
            # Restore the runner search list and remove only profiles installed here.
            python3 - <<'PY_CLEANUP'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                          *shlex.split((root / 'keychains.txt').read_text())], check=True)
          for profile in root.glob('installed-*.txt'):
              pathlib.Path(profile.read_text()).unlink(missing_ok=True)
          PY_CLEANUP
            security delete-keychain "$keychain" || true
            rm -rf "$signing_dir"
          }
          trap cleanup EXIT

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          python3 - <<'PY_KEYCHAINS'
          import os, pathlib, shlex, subprocess
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          subprocess.run(['security', 'list-keychains', '-d', 'user', '-s',
                          str(root / 'signing.keychain-db'),
                          *shlex.split((root / 'keychains.txt').read_text())], check=True)
          PY_KEYCHAINS
          python3 - <<'PY_CERT'
          import base64, os, pathlib
          pathlib.Path(os.environ['SIGNING_DIR'], 'certificate.p12').write_bytes(
              base64.b64decode(os.environ['IOS_CERTIFICATE_BASE64'], validate=True))
          PY_CERT
          security import "$signing_dir/certificate.p12" -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain" >/dev/null

          python3 - <<'PY_PROFILES'
          import base64, json, os, pathlib, plistlib, subprocess
          root = pathlib.Path(os.environ['SIGNING_DIR'])
          profiles = json.loads(os.environ['IOS_PROFILES_BASE64_JSON'])
          bundles = ['io.github.ccch1mneyyy.dshApp',
                     'io.github.ccch1mneyyy.dshApp.PetLiveActivity']
          if set(profiles) != set(bundles):
              raise ValueError('Profiles must cover exactly Runner and PetLiveActivity bundle IDs')
          destination = pathlib.Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles'
          destination.mkdir(parents=True, exist_ok=True)
          mapping = {}
          for index, bundle in enumerate(bundles):
              raw = base64.b64decode(profiles[bundle], validate=True)
              temp = root / f'profile-{index}.mobileprovision'
              temp.write_bytes(raw)
              decoded = subprocess.check_output(['security', 'cms', '-D', '-i', str(temp)])
              profile = plistlib.loads(decoded)
              if os.environ['IOS_TEAM_ID'] not in profile['TeamIdentifier']:
                  raise ValueError('Profile team does not match IOS_TEAM_ID')
              installed = destination / (profile['UUID'] + '.mobileprovision')
              if installed.exists():
                  raise ValueError('Refusing to overwrite an existing provisioning profile')
              (root / f'installed-{index}.txt').write_text(str(installed))
              installed.write_bytes(raw)
              mapping[bundle] = profile['UUID']
          (root / 'profiles.json').write_text(json.dumps(mapping))
          options = dict(method=os.environ['IOS_EXPORT_METHOD'],
                         teamID=os.environ['IOS_TEAM_ID'], signingStyle='manual',
                         signingCertificate=os.environ['IOS_SIGNING_IDENTITY'],
                         provisioningProfiles=mapping)
          with (root / 'ExportOptions.plist').open('wb') as output:
              plistlib.dump(options, output)
          PY_PROFILES

          # Modify only the ephemeral runner checkout, assigning profiles per app target.
          ruby - <<'RUBY_PROJECT'
          require 'json'
          require 'xcodeproj'
          profiles = JSON.parse(File.read(File.join(ENV.fetch('SIGNING_DIR'), 'profiles.json')))
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.targets.each do |target|
            next unless ['Runner', 'PetLiveActivity'].include?(target.name)
            target.build_configurations.each do |config|
              bundle = config.build_settings.fetch('PRODUCT_BUNDLE_IDENTIFIER')
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = profiles.fetch(bundle)
            end
          end
          project.save
          RUBY_PROJECT

          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IOS_SIGNING_IDENTITY" \
            SHELLBOX_LIBS_ROOT="$RUNNER_TEMP/shellbox-ios-libs" archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$signing_dir/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-ipa"
          echo 'exported=true' >> "$GITHUB_OUTPUT"

      - name: Upload IPA
        if: steps.signing.outputs.exported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-ipa/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/ios-ipa-logs/*.log
          if-no-files-found: warn
          retention-days: 7
